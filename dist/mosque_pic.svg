<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- AUTHENTIC HASSAN II / MOROCCAN MINARET -->
  
  <!-- Jamur (Gold Brass Spheres) -->
  <path d="M 12 1 V 4.5" stroke="#d97706" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="12" cy="2" r="1.1" fill="#fbbf24" />
  <circle cx="12" cy="3.5" r="0.8" fill="#fbbf24" />
  <circle cx="12" cy="4.8" r="0.5" fill="#fbbf24" />

  <!-- Qubba (Dome) -->
  <path d="M 9.5 7.5 C 9.5 5 14.5 5 14.5 7.5 Z" fill="#047857" />

  <!-- Upper Lantern Room -->
  <rect x="9.5" y="7.5" width="5" height="3.5" fill="#fde68a" />
  <!-- Lantern Arch/Window -->
  <path d="M 11 11 V 8.8 C 11 8.2 13 8.2 13 8.8 V 11 Z" fill="#0f172a" />

  <!-- Main Shaft -->
  <rect x="7.5" y="11.5" width="9" height="12.5" fill="#fef3c7" />

  <!-- Emerald Zellij Frieze (Top band) -->
  <rect x="7.5" y="11.5" width="9" height="3" fill="#047857" />
  <circle cx="12" cy="13" r="1" fill="#facc15" />
  <circle cx="9.2" cy="13" r="0.6" fill="#ffffff" />
  <circle cx="14.8" cy="13" r="0.6" fill="#ffffff" />

  <!-- Central Moroccan Horseshoe Arch -->
  <!-- Outer Arch frame (Green) -->
  <path d="M 9.5 24 V 17 C 9.5 15 14.5 15 14.5 17 V 24 Z" fill="#047857" />
  <!-- Inner Arch layer (Light Stone) -->
  <path d="M 10.2 24 V 17.5 C 10.2 15.8 13.8 15.8 13.8 17.5 V 24 Z" fill="#fde68a" />
  <!-- Dark Window Opening -->
  <path d="M 11 24 V 18 C 11 17 13 17 13 18 V 24 Z" fill="#0f172a" />

  <!-- Side Zellij Vertical Details -->
  <rect x="8.2" y="15.5" width="0.6" height="8.5" fill="#059669" />
  <rect x="15.2" y="15.5" width="0.6" height="8.5" fill="#059669" />
</svg>