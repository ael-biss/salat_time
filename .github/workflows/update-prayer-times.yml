name: Update Sala Al-Jadida Prayer Times

on:
  schedule:
    # Runs daily at 01:00 UTC (02:00 AM Morocco standard time)
    - cron: '0 1 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run scraper
        run: |
          python backend/scrape_sala.py

      - name: Commit and push updated prayer times
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add backend/public/api/sala-al-jadida/*.json
          if git diff --staged --quiet; then
            echo "No changes detected in prayer times data."
          else
            git commit -m "chore(data): update Sala Al-Jadida prayer schedule [skip ci]"
            git push
          fi
